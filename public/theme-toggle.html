<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переключатель темы</title>
<script>
  // Ставим тему до первой отрисовки, чтобы не было вспышки.
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1c19;
    --muted: #6b6860;
    --border: #e3e0d8;
    --accent: #d9582b;
    --btn-bg: #1d1c19;
    --btn-fg: #f6f5f1;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .06);

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-reveal: cubic-bezier(0.77, 0, 0.175, 1);
    --ui: 300ms;
    --press: 140ms;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #121211;
    --surface: #1c1c1a;
    --text: #efede7;
    --muted: #9a978f;
    --border: #2d2c29;
    --accent: #f08a5d;
    --btn-bg: #efede7;
    --btn-fg: #121211;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    width: min(100%, 420px);
    padding: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  p  { margin: 12px 0 0; color: var(--muted); }
  .accent { color: var(--accent); font-weight: 600; }

  /* ---------- Кнопка ---------- */
  .theme-toggle {
    position: relative;
    flex: none;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--btn-fg);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform var(--press) var(--ease-out);
    -webkit-tap-highlight-color: transparent;
  }
  .theme-toggle:active { transform: scale(0.9); }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .theme-toggle svg {
    grid-area: 1 / 1;
    width: 22px;
    height: 22px;
    transition:
      transform var(--ui) var(--ease-out),
      opacity var(--ui) var(--ease-out),
      filter var(--ui) var(--ease-out);
  }

  /* Светлая тема: видно луну (переход в тёмную), солнце спрятано. */
  .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.5); filter: blur(4px); }
  .icon-moon { opacity: 1; transform: none; filter: none; }

  [data-theme="dark"] .icon-sun  { opacity: 1; transform: none; filter: none; }
  [data-theme="dark"] .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); filter: blur(4px); }

  /* ---------- View Transitions ---------- */
  /* Отключаем стандартный кроссфейд — анимацию задаём из JS. */
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
  }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) { z-index: 2; }

  /* ---------- Reduced motion: спокойнее, но не выключено ---------- */
  @media (prefers-reduced-motion: reduce) {
    :root { --ui: 200ms; }
    .theme-toggle:active { transform: scale(0.96); }
    .icon-sun,
    [data-theme="dark"] .icon-moon { transform: none; filter: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="row">
      <h1>Тема оформления</h1>
      <button class="theme-toggle" type="button" aria-label="Включить тёмную тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
    <p>Нажмите кнопку — новая тема раскроется кругом из её центра.
       Цвета заданы <span class="accent">CSS-переменными</span>,
       тема хранится в <code>data-theme</code> на <code>&lt;html&gt;</code>.</p>
  </main>

<script>
(function () {
  var root = document.documentElement;
  var button = document.querySelector('.theme-toggle');
  var reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  var current = null; // активный ViewTransition

  function syncButton() {
    var dark = root.dataset.theme === 'dark';
    button.setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
    button.setAttribute('aria-pressed', String(dark));
  }

  function applyTheme(theme) {
    root.dataset.theme = theme;
    try { localStorage.setItem('theme', theme); } catch (e) {}
    syncButton();
  }

  /* ---------- Звук ---------- */
  var audioCtx = null;

  function playChord(up) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { return; }

    // До-мажорное трезвучие: вверх для светлой, вниз для тёмной (октавой ниже).
    var notes = up ? [523.25, 659.25, 783.99] : [392.0, 329.63, 261.63];
    var now = audioCtx.currentTime;
    var master = audioCtx.createGain();
    master.gain.value = 0.12;
    master.connect(audioCtx.destination);

    notes.forEach(function (freq, i) {
      var start = now + i * 0.045;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.5, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.38);
      osc.connect(gain).connect(master);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  }

  /* ---------- Переключение ---------- */
  function toggle() {
    var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    playChord(next === 'light');

    // Старые браузеры: просто меняем тему.
    if (!document.startViewTransition) {
      applyTheme(next);
      return;
    }

    // Быстрые повторные клики: завершаем предыдущий переход мгновенно.
    if (current) current.skipTransition();

    var rect = button.getBoundingClientRect();
    var x = rect.left + rect.width / 2;
    var y = rect.top + rect.height / 2;
    var radius = Math.hypot(
      Math.max(x, innerWidth - x),
      Math.max(y, innerHeight - y)
    );

    var transition = document.startViewTransition(function () { applyTheme(next); });
    current = transition;
    transition.finished.finally(function () {
      if (current === transition) current = null;
    });

    transition.ready.then(function () {
      if (reducedMotion.matches) {
        // Спокойный вариант: мягкое проявление без движения.
        root.animate(
          { opacity: [0, 1] },
          { duration: 240, easing: 'cubic-bezier(0.23, 1, 0.32, 1)',
            pseudoElement: '::view-transition-new(root)' }
        );
        return;
      }
      root.animate(
        { clipPath: [
          'circle(0px at ' + x + 'px ' + y + 'px)',
          'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'
        ] },
        { duration: 520, easing: 'cubic-bezier(0.77, 0, 0.175, 1)',
          pseudoElement: '::view-transition-new(root)' }
      );
    }).catch(function () {});
  }

  button.addEventListener('click', toggle);
  syncButton();
})();
</script>
</body>
</html>
